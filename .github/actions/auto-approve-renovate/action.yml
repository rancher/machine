name: Auto-approve Renovate pull requests
description: Approve eligible Renovate pull requests after their checks pass
inputs:
  force:
    description: Ignore the minimum pull request age
    required: false
    default: "false"
  renovate-bot-username:
    description: Renovate bot login to inspect
    required: false
    default: ""
  min-working-days:
    description: Minimum number of completed working days before approval
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate PR eligibility
      id: eligibility
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RENOVATE_BOT_USERNAME: ${{ inputs.renovate-bot-username || vars.RENOVATE_BOT_USERNAME || 'app/renovate-rancher' }}
        MIN_WORKING_DAYS: ${{ inputs.min-working-days || vars.RENOVATE_AUTO_APPROVE_MIN_WORKING_DAYS || '1' }}
        FORCE: ${{ inputs.force }}
      run: |
        set -euo pipefail

        if ! [[ "$MIN_WORKING_DAYS" =~ ^[0-9]+$ ]]; then
          echo "min-working-days must be a non-negative integer."
          exit 1
        fi

        today=$(date -u +%F)
        eligible_prs=()
        if ! pr_list_json=$(gh pr list --repo "$REPO" --state open \
          --author "$RENOVATE_BOT_USERNAME" \
          --limit 100 \
          --json number,state,body,autoMergeRequest,headRepository,headRefName,author,createdAt \
          --jq 'sort_by(.createdAt)[] | @json'); then
          echo "Failed to get open Renovate PRs from $REPO."
          exit 1
        fi

        if [[ -z "$pr_list_json" ]]; then
          echo "No open Renovate PRs to review."
          printf 'eligible_prs=\n' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        while IFS= read -r pr_json; do
          pr_number=$(jq -r '.number' <<<"$pr_json")
          head_ref=$(jq -r '.headRefName' <<<"$pr_json")
          pr_body=$(jq -r '.body // ""' <<<"$pr_json")

          if [[ $(jq -r '.state' <<<"$pr_json") != "OPEN" ||
                $(jq -r '.autoMergeRequest' <<<"$pr_json") == "null" ||
                $(jq -r '.headRepository.nameWithOwner' <<<"$pr_json") != "$REPO" ||
                $(jq -r '.author.login' <<<"$pr_json") != "$RENOVATE_BOT_USERNAME" ||
                "$head_ref" != renovate/* ]]; then
            continue
          fi
          if ! [[ "$pr_body" =~ \*\*[[:space:]]*Automerge[[:space:]]*\*\*[[:space:]]*:[[:space:]]*Enabled[[:space:]]*\.? ]]; then
            continue
          fi

          created_date=$(date -u -d "$(jq -r '.createdAt' <<<"$pr_json")" +%F)
          working_days=0
          date_cursor=$created_date
          while [[ "$date_cursor" < "$today" ]]; do
            [[ $(date -u -d "$date_cursor" +%u) -lt 6 ]] &&
              working_days=$((working_days + 1))
            date_cursor=$(date -u -d "$date_cursor + 1 day" +%F)
          done
          if [[ "$FORCE" != "true" ]] && (( working_days < MIN_WORKING_DAYS )); then
            echo "PR #$pr_number is too new ($working_days working days old)."
            continue
          fi

          if ! check_buckets=$(gh pr checks "$pr_number" --repo "$REPO" --json bucket); then
            echo "Could not read checks for PR #$pr_number."
            continue
          fi
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass")' <<<"$check_buckets" >/dev/null; then
            echo "PR #$pr_number does not have all checks green."
            continue
          fi

          eligible_prs+=("$pr_number")
        done <<<"$pr_list_json"

        printf 'eligible_prs=%s\n' "${eligible_prs[*]}" >> "$GITHUB_OUTPUT"

    - name: Read App Secrets
      if: steps.eligibility.outputs.eligible_prs != ''
      uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
      with:
        secrets: |
          secret/data/github/repo/rancher/machine/github/pr-actions-write-app/credentials appId | APP_ID ;
          secret/data/github/repo/rancher/machine/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY

    - name: Create App Token
      if: steps.eligibility.outputs.eligible_prs != ''
      id: app-token
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
      with:
        app-id: ${{ env.APP_ID }}
        private-key: ${{ env.PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ github.event.repository.name }}
        permission-pull-requests: write

    - name: Approve PRs
      if: steps.eligibility.outputs.eligible_prs != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBERS: ${{ steps.eligibility.outputs.eligible_prs }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        for pr_number in $PR_NUMBERS; do
          review_decision=$(gh pr view "$pr_number" --repo "$REPO" \
            --json reviewDecision --jq '.reviewDecision')

          if [[ "$review_decision" == "APPROVED" ]]; then
            echo "PR #$pr_number is currently approved."
            continue
          fi

          gh pr review "$pr_number" \
            --repo "$REPO" \
            --approve \
            --body "Auto-approving Renovate PR with auto-merge enabled."
        done
