name: Daily Tag

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: master
            base_pattern: 'v0\.15\.0-rancher'
          - ref: release/v2.15
            base_pattern: 'v0\.15\.0-rancher145\.'
          - ref: release/v2.14
            base_pattern: 'v0\.15\.0-rancher142\.'
          - ref: release/v2.13
            base_pattern: 'v0\.15\.0-rancher137\.'
    concurrency:
      group: daily-tag-${{ matrix.ref }}
      cancel-in-progress: false
    steps:
      - name: Get Rancher App secrets
        uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
        with:
          secrets: |
            secret/data/github/repo/rancher/machine/github/pr-actions-write-app/credentials appId      | APP_ID ;
            secret/data/github/repo/rancher/machine/github/pr-actions-write-app/credentials privateKey | PRIVATE_KEY
      - name: Create Rancher App token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: rancher-app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: rancher
          repositories: machine
          permission-contents: write
      - name: Checkout branch and tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # using EIO app token so we can trigger release workflow if a new tag gets pushed
          token: ${{ steps.rancher-app-token.outputs.token }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Configure tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create tag when branch changed
        run: ./scripts/tag-rc-if-ref-changed "${{ matrix.base_pattern }}" origin "${{ matrix.ref }}"
      - name: Push tags
        run: git push --tags
