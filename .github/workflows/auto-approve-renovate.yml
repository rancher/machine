name: Renovate Auto-Approve

on:
  schedule:
    # 15:00 UTC, Monday through Friday.
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: Ignore minimum PR age
        required: false
        default: false
        type: boolean

concurrency:
  group: renovate-auto-approve-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  approve:
    name: Approve Renovate PRs
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Auto-approve eligible Renovate PRs
        uses: ./.github/actions/auto-approve-renovate
        with:
          force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
