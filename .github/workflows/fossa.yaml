name: Run Fossa Scan

on:
  push:
    branches:
      - master
  # For manual scans.
  workflow_dispatch:

jobs:
  fossa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for the Vault authentication
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read FOSSA token
        uses: rancher-eio/read-vault-secrets@282ca339e6cd3a2dd7ad92448b9389de9c88222a # main
        with:
          secrets: |
            secret/data/github/org/rancher/fossa/push token | FOSSA_API_KEY_PUSH_ONLY

      - name: FOSSA scan
        uses: fossas/fossa-action@b6aa59d9b26f1fbdeb87989c13cb80b211296c03 # main
        with:
          api-key: ${{ env.FOSSA_API_KEY_PUSH_ONLY }}
          run-tests: false
